[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkvserve"
version = "0.1.0"
description = "RWKV Inference & Serving - OpenAI-Compatible API Server with Continuous Batching"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "RWKVServe Contributors"}
]
keywords = ["rwkv", "inference", "serving", "api-server", "continuous-batching", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "transformers>=4.30.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
structured-output = [
    "lm-format-enforcer>=0.10.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "lm-format-enforcer>=0.10.0",
]

[project.scripts]
rwkvserve = "rwkvserve.cli.serve:main"
rwkvserve-infer = "rwkvserve.cli.infer:main"

[project.urls]
Homepage = "https://github.com/aierwiki/rwkvserve"
Repository = "https://github.com/aierwiki/rwkvserve"

[tool.setuptools.packages.find]
where = ["."]
include = ["rwkvserve*"]
exclude = ["tests*", "examples*", "docs*", "scripts*"]

[tool.setuptools.package-data]
rwkvserve = [
    "data/tokenizers/vocab/*.txt",
    "models/rwkv7/operators/cuda/*.cu",
    "models/rwkv7/operators/cuda/*.cpp",
    "api/chat_templates/*.jinja",
    "configs/models/*.json",
    "py.typed",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
